# Semgrep rules for mistakes that AI coding assistants commonly produce, for the Node.js
# services (js-*) and the Python aiops-engine (ai-*, llm-*). They run on every pull request (security.yml); on PRs labelled
# "ai-assisted" any ERROR finding blocks the merge.
rules:
  - id: ai-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: "subprocess with shell=True runs a shell: command injection if any part is user-controlled. Pass a list and shell=False."
    metadata: { cwe: "CWE-78", owasp: "A05:2025 Injection" }
    pattern-either:
      - pattern: subprocess.$F(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: ai-eval-exec
    languages: [python]
    severity: ERROR
    message: "eval/exec run arbitrary code. Parse the data instead (json.loads, ast.literal_eval)."
    metadata: { cwe: "CWE-95" }
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: ai-unsafe-deserialisation
    languages: [python]
    severity: ERROR
    message: "Unsafe deserialisation: pickle/marshal or yaml.load without SafeLoader can execute code. Use json or yaml.safe_load."
    metadata: { cwe: "CWE-502", owasp: "A08:2025 Software or Data Integrity Failures" }
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: marshal.loads(...)
      - pattern: yaml.load($X)
      - pattern: yaml.load($X, Loader=yaml.Loader)
      - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)

  - id: ai-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: "TLS certificate verification is disabled (verify=False): anyone on the path can read and change the traffic."
    metadata: { cwe: "CWE-295" }
    pattern-either:
      - pattern: $CLIENT.$METHOD(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: httpx.AsyncClient(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)

  - id: ai-sql-built-with-strings
    languages: [python]
    severity: ERROR
    message: "SQL built with string formatting: SQL injection. Use bound parameters (text(':x'), select(), cursor.execute(sql, params))."
    metadata: { cwe: "CWE-89", owasp: "A05:2025 Injection" }
    pattern-either:
      - pattern: $DB.execute(f"...")
      - pattern: $DB.execute("..." % ...)
      - pattern: $DB.execute("...".format(...))
      - pattern: $DB.execute("..." + ...)
      - pattern: sqlalchemy.text(f"...")
      - pattern: text(f"...")

  - id: ai-hardcoded-secret
    languages: [python]
    paths:
      exclude: ["tests/", "test_*.py", "conftest.py"]
    severity: ERROR
    message: "A secret looks hard-coded. Read it from the environment / a Kubernetes Secret, never from source code."
    metadata: { cwe: "CWE-798" }
    patterns:
      - pattern: $NAME = "$VALUE"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(password|passwd|secret|api_?key|token|private_?key).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^[^\s]{12,}$

  - id: ai-insecure-randomness-for-secrets
    languages: [python]
    severity: WARNING
    message: "random is predictable. Use secrets.token_urlsafe / secrets.choice for tokens, ids and passwords."
    metadata: { cwe: "CWE-338" }
    patterns:
      - pattern-either:
          - pattern: random.choice(...)
          - pattern: random.randint(...)
          - pattern: random.random()
      - pattern-inside: |
          def $F(...):
            ...
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(token|secret|password|key|otp|nonce|session).*

  - id: ai-jwt-signature-not-verified
    languages: [python]
    severity: ERROR
    message: "JWT decoded without verifying the signature: anyone can forge the token."
    metadata: { cwe: "CWE-347" }
    pattern-either:
      - pattern: |
          jwt.decode(..., options={..., "verify_signature": False, ...}, ...)
      - pattern: jwt.decode(..., verify=False, ...)

  - id: ai-cors-wildcard-with-credentials
    languages: [python]
    severity: ERROR
    message: "CORS allows every origin together with credentials: any website can act as the logged-in user."
    metadata: { cwe: "CWE-942" }
    pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)

  - id: ai-secret-compared-with-equals
    languages: [python]
    paths:
      exclude: ["tests/", "test_*.py", "conftest.py"]
    severity: WARNING
    message: "Compare tokens with hmac.compare_digest (constant time), not ==, to avoid timing attacks."
    metadata: { cwe: "CWE-208" }
    patterns:
      - pattern-either:
          - pattern: $A == $B
          - pattern: $A != $B
      - metavariable-regex:
          metavariable: $A
          regex: (?i).*(token|secret|api_?key|password|signature).*

  - id: ai-phi-in-logs
    languages: [python]
    severity: ERROR
    message: "Possible patient data in logs (HealthTech): log opaque ids only, never names, dates of birth, addresses or contact details."
    metadata: { cwe: "CWE-532" }
    patterns:
      - pattern-either:
          - pattern: |
              $LOG.$LEVEL(..., extra={..., "$KEY": $V, ...}, ...)
          - pattern: $LOG.$LEVEL(f"...{$X.$KEY}...", ...)
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(debug|info|warning|error|exception|critical)$
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(name|full_?name|first_?name|last_?name|dob|date_of_birth|address|email|phone|nhs_?number|ssn|pseudonym)$

  # ---- LLM-specific (OWASP Top 10 for LLM applications) ----
  - id: llm-output-executed
    languages: [python]
    severity: ERROR
    message: "Model output reaches code execution or a shell (LLM05 improper output handling / LLM06 excessive agency). Treat model output as untrusted data; validate it against a schema and never execute it."
    mode: taint
    pattern-sources:
      - pattern: $C.messages.create(...)
      - pattern: $C.beta.messages.create(...)
      - pattern: $C.messages.parse(...)
      - pattern: $C.beta.messages.parse(...)
      - pattern: await $C.messages.create(...)
      - pattern: await $C.beta.messages.parse(...)
    pattern-sinks:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: os.system(...)
      - pattern: subprocess.$F(...)
      - patterns:
          - pattern: $K8S.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(delete|patch|replace|create)_namespaced_\w+$

  - id: llm-api-key-in-code
    languages: [python]
    severity: ERROR
    message: "API key passed literally to an LLM client. Let the SDK read ANTHROPIC_API_KEY from the environment (a Kubernetes Secret)."
    metadata: { cwe: "CWE-798" }
    pattern-either:
      - pattern: anthropic.Anthropic(api_key="...")
      - pattern: anthropic.AsyncAnthropic(api_key="...")

  # ======================= JavaScript / Node.js services =======================
  - id: js-eval-new-function
    languages: [javascript]
    severity: ERROR
    message: "eval / new Function / string timers run arbitrary code. Parse data (JSON.parse) instead."
    metadata: { cwe: "CWE-95" }
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)
      - pattern: setTimeout("...", ...)
      - pattern: setInterval("...", ...)
      - pattern: $VM.runInThisContext(...)
      - pattern: $VM.runInNewContext(...)

  - id: js-child-process-shell
    languages: [javascript]
    severity: ERROR
    message: "A shell command from code (child_process.exec / shell: true): command injection if any part is user-controlled. Use execFile/spawn with an argument array."
    metadata: { cwe: "CWE-78", owasp: "A05:2025 Injection" }
    pattern-either:
      - pattern: require("child_process").exec(...)
      - pattern: require("child_process").execSync(...)
      - pattern: require("node:child_process").exec(...)
      - pattern: require("node:child_process").execSync(...)
      - pattern: $CP.exec(`...`, ...)
      - pattern: $CP.execSync(`...`, ...)
      - pattern: '$CP.spawn($CMD, $ARGS, {..., shell: true, ...})'

  - id: js-sql-built-with-strings
    languages: [javascript]
    severity: ERROR
    message: "SQL built from strings: SQL injection. Use bound parameters: pool.query('... WHERE id = $1', [id])."
    metadata: { cwe: "CWE-89", owasp: "A05:2025 Injection" }
    pattern-either:
      - pattern: $DB.query(`...${$X}...`, ...)
      - pattern: $DB.query("..." + $X, ...)
      - pattern: $DB.query($A + $B, ...)
      - pattern: $DB.query($S.concat(...), ...)

  - id: js-tls-verification-disabled
    languages: [javascript]
    severity: ERROR
    message: "TLS certificate verification is disabled: anyone on the path can read and change the traffic. Provide the CA instead."
    metadata: { cwe: "CWE-295" }
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: js-secret-compared-with-equals
    languages: [javascript]
    severity: WARNING
    message: "Secret compared with ===: the time taken leaks how much matched. Use crypto.timingSafeEqual (common.safeEqual)."
    metadata: { cwe: "CWE-208" }
    patterns:
      - pattern-either:
          - pattern: $A === $B
          - pattern: $A == $B
          - pattern: $A !== $B
          - pattern: $A != $B
      - metavariable-regex:
          metavariable: $B
          regex: (?i).*(token|secret|password|api_?key)\b.*
      - pattern-not: $A === undefined
      - pattern-not: $A === null
      - pattern-not: $A === "..."

  - id: js-html-injection-sink
    languages: [javascript]
    severity: ERROR
    message: "Writing HTML from data (innerHTML, outerHTML, insertAdjacentHTML, document.write): record text or model output becomes markup or script (XSS, LLM05). Use textContent / createElement."
    metadata: { cwe: "CWE-79" }
    pattern-either:
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.outerHTML = $X
      - pattern: $EL.insertAdjacentHTML(...)
      - pattern: document.write(...)
      - pattern: document.writeln(...)

  - id: js-phi-in-logs
    languages: [javascript]
    severity: WARNING
    message: "A patient identifier, clinical text or an LLM prompt/answer in a log line. Log opaque ids only (patient_id), never content."
    metadata: { cwe: "CWE-532" }
    patterns:
      - pattern: '$LOG.$LEVEL({..., $KEY: $V, ...}, ...)'
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(trace|debug|info|warn|error|fatal)$
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(name|full_?name|dob|date_of_birth|address|email|phone|nhs_?number|ssn|pseudonym|question|answer|prompt|completion|note|body|record)$

  - id: js-llm-output-executed
    languages: [javascript]
    severity: ERROR
    message: "Model output reaches code execution, a shell, a URL or HTML (LLM05 improper output handling / LLM06 excessive agency). Validate it against a schema and use it as data only."
    mode: taint
    pattern-sources:
      - pattern: $C.messages.create(...)
      - pattern: $C.messages.parse(...)
      - pattern: $C.beta.messages.create(...)
      - pattern: $C.beta.messages.parse(...)
    pattern-sinks:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: $CP.exec(...)
      - pattern: $CP.execSync(...)
      - pattern: fetch(...)
      - pattern: $EL.innerHTML = $X
      - pattern: $DB.query(...)

  - id: js-llm-api-key-in-code
    languages: [javascript]
    severity: ERROR
    message: "API key passed literally to the Anthropic client. Let the SDK read ANTHROPIC_API_KEY from the environment (a Kubernetes Secret)."
    metadata: { cwe: "CWE-798" }
    pattern-either:
      - pattern: 'new $A({..., apiKey: "...", ...})'
      - pattern: 'new $A({..., apiKey: `...`, ...})'
