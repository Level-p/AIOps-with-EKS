# Gitleaks configuration: the default rules, plus an allow-list for test fixtures that
# contain FAKE secrets on purpose (to prove that redaction and the AI-code rules catch them).
[extend]
useDefault = true

[allowlist]
description = "Intentional fake secrets in tests and rule fixtures"
paths = [
  '''services/[^/]+/tests/.*''',
  '''scripts/tests/.*''',
  '''\.semgrep/ai-code-rules\.py''',
]
