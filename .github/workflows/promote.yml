# ---------------------------------------------------------------------------
# CareSignal: promote what runs in stage to production (GitOps, two keys)
# The DAST scan of stage is a separate workflow (dast.yml, target stage): run it when you choose.
#   1. approval of the "production" environment (required reviewers)
#   2. the same image tags (already signed, scanned and running in stage) are
#      copied into values-prod.yaml, as a PULL REQUEST (main is protected): merge it
#   3. Argo CD shows caresignal-prod OutOfSync; a person reviews the diff and syncs
# Roll back: a pull request reverting the promotion, merge, Sync.
# ---------------------------------------------------------------------------
name: CareSignal Promote to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caresignal-gitops-refs/heads/main
  cancel-in-progress: false

env:
  CHART: deploy/helm/caresignal

jobs:
  promote:
    name: Copy stage tags to prod
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the gitops/prod-* branch
      pull-requests: write   # open its pull request
    environment:
      name: production
      url: https://caresignal.${{ vars.DOMAIN_NAME || 'mfon21.space' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Copy tags
        run: |
          for name in $(yq -r '.services | keys | .[]' "$CHART/values-stage.yaml"); do
            TAG=$(NAME="$name" yq '.services[strenv(NAME)].tag' "$CHART/values-stage.yaml")
            NAME="$name" TAG="$TAG" yq -i '.services[strenv(NAME)].tag = strenv(TAG)' "$CHART/values-prod.yaml"
          done
          { echo '### Changes for production'; echo '```diff'; git diff -- "$CHART/values-prod.yaml"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Stage the change
        run: git add "$CHART/values-prod.yaml"
      # main is protected (pull requests only): the promotion is a pull request; after the merge, SYNC in Argo CD
      - uses: ./.github/actions/gitops-pr
        with:
          branch: gitops/prod-run${{ github.run_number }}
          title: "ci: promote stage images to prod (run ${{ github.run_number }})"
          next-step: "After the merge, Argo CD shows caresignal-prod OutOfSync: review the APP DIFF and press SYNC."
